spring.application.name=tp2-jpa
server.port=8085

# Unité de persistance : base H2 en mémoire
spring.datasource.url=jdbc:h2:mem:products-db
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Pour passer à MySQL, remplacer les lignes datasource par :
# spring.datasource.url=jdbc:mysql://localhost:3306/products-db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=
# (et ajouter la dépendance com.mysql:mysql-connector-j dans le pom.xml)
